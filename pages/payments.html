<!DOCTYPE html>
<html lang="es" data-page="payments">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shield — Métodos de pago</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../style.css" />
</head>
<body data-page="payments">
<script>window.BASE_PATH = "../";</script>

<div class="app">
  <div id="sidebar-root"></div>

  <div class="main">
    <div id="topbar-root"></div>

    <main class="content">
      <div class="page-header">
        <div>
          <h2>💰 Métodos de pago</h2>
          <p>Bancos, billeteras digitales, cuentas y códigos QR.</p>
        </div>
        <button class="btn btn--primary" id="add-btn" type="button">+ Nuevo método</button>
      </div>

      <div class="toolbar">
        <div class="toolbar__search">
          <input type="search" id="search-input" placeholder="Buscar por nombre o cuenta..." autocomplete="off" />
        </div>
        <select class="select" id="type-filter">
          <option value="">Todos los tipos</option>
          <option value="Banco">Banco</option>
          <option value="Billetera digital">Billetera digital</option>
          <option value="Cuenta">Cuenta</option>
          <option value="QR de pago">QR de pago</option>
        </select>
      </div>

      <div class="record-grid" id="record-grid"></div>
    </main>
  </div>
</div>

<!-- Modal: crear/editar método de pago -->
<div class="modal-overlay" id="payment-modal">
  <div class="modal">
    <div class="modal__header">
      <h3 id="modal-title">Nuevo método de pago</h3>
      <button class="icon-btn" data-modal-close type="button">✕</button>
    </div>
    <form id="payment-form">
      <div class="modal__body">
        <div class="form-grid">
          <div class="form-field form-field--full">
            <label for="f-name">Nombre</label>
            <input type="text" id="f-name" required placeholder="Ej. Banco Demo - Cuenta Corriente" />
          </div>
          <div class="form-field">
            <label for="f-type">Tipo</label>
            <select id="f-type">
              <option value="Banco">Banco</option>
              <option value="Billetera digital">Billetera digital</option>
              <option value="Cuenta">Cuenta</option>
              <option value="QR de pago">QR de pago</option>
            </select>
          </div>
          <div class="form-field">
            <label for="f-status">Estado</label>
            <select id="f-status">
              <option value="active">Activo</option>
              <option value="inactive">Inactivo</option>
            </select>
          </div>
          <div class="form-field form-field--full">
            <label for="f-account">Cuenta / referencia</label>
            <input type="text" id="f-account" required />
          </div>
          <div class="form-field form-field--full">
            <label for="f-description">Descripción</label>
            <textarea id="f-description"></textarea>
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button type="button" class="btn" data-modal-close>Cancelar</button>
        <button type="submit" class="btn btn--primary">Guardar</button>
      </div>
    </form>
  </div>
</div>

<div id="toast-root"></div>

<script type="module" src="../js/layout.js"></script>
<script type="module" src="../app.js"></script>
<script type="module" src="../js/payments.js"></script>
</body>
</html>
